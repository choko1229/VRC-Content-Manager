<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン - BOOTH Asset Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="login-page">
    <main class="login-card">
      <h1><span class="icon" aria-hidden="true">lock</span>ログイン</h1>
      {% if error %}<div class="alert alert-error" role="alert"><span class="icon" aria-hidden="true">error</span>{{ error }}</div>{% endif %}
      <form method="post" action="/login{% if request.query_params.get('next') %}?next={{ request.query_params.get('next') }}{% endif %}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
        <label for="login-password">パスワード</label>
        <input id="login-password" type="password" name="password" required autofocus autocomplete="current-password">
        <button type="submit" class="btn btn-primary" style="margin-top: var(--space-4); width: 100%;">
          <span class="icon" aria-hidden="true">login</span>ログイン
        </button>
      </form>
    </main>
  </div>
</body>
</html>

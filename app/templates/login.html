<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン - BOOTH Asset Manager</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="app-main" style="max-width: 360px;">
    <h1>ログイン</h1>
    {% if error %}<p class="field-error">{{ error }}</p>{% endif %}
    <form method="post" action="/login{% if request.query_params.get('next') %}?next={{ request.query_params.get('next') }}{% endif %}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
      <label>パスワード<br><input type="password" name="password" required autofocus></label>
      <p><button type="submit">ログイン</button></p>
    </form>
  </main>
</body>
</html>

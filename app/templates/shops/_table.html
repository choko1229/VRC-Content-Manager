{% if error %}<p class="field-error">{{ error }}</p>{% endif %}
{% if shops %}
<table>
  <thead>
    <tr>
      <th>ショップ名</th>
      <th>URL</th>
      <th>メモ</th>
      <th>登録商品数</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for shop in shops %}
    <tr>
      <td>{{ shop.name }}</td>
      <td>{% if shop.url %}<a href="{{ shop.url }}" target="_blank" rel="noopener noreferrer">{{ shop.url }}</a>{% endif %}</td>
      <td>{{ shop.memo or "" }}</td>
      <td>{{ shop.item_count }}</td>
      <td>
        <button
          class="danger"
          hx-delete="/fragments/shops/{{ shop.id }}"
          hx-target="#shop-list"
          hx-swap="innerHTML"
          hx-confirm="「{{ shop.name }}」を削除しますか？"
        >削除</button>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p class="muted">まだショップが登録されていません。</p>
{% endif %}

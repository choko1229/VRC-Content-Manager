{% if results %}
<div id="booth-suggestions">
  <p class="text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1.5">ファイル名からBOOTHの商品を推測しました。該当するものがあれば選択してください。</p>
  <div class="flex flex-wrap gap-2">
    {% for r in results %}
    <button type="button" class="js-booth-suggestion group flex items-center gap-2 w-full sm:w-auto sm:max-w-[16rem] text-left rounded-xl border border-white/70 dark:border-white/15 bg-white/60 dark:bg-white/10 backdrop-blur px-2.5 py-2 hover:bg-accent/10 dark:hover:bg-accent-dark/10 hover:border-accent/40 dark:hover:border-accent-dark/40 transition focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent dark:focus-visible:outline-accent-dark"
            data-product-url="{{ r.product_url }}">
      {% if r.thumbnail_url %}
      <img src="{{ r.thumbnail_url }}" alt="" class="w-10 h-10 rounded-lg object-cover shrink-0">
      {% else %}
      <span class="w-10 h-10 rounded-lg bg-white/70 dark:bg-white/10 flex items-center justify-center shrink-0">
        <span class="icon text-[1.1rem] text-slate-400" aria-hidden="true">image</span>
      </span>
      {% endif %}
      <span class="min-w-0">
        <span class="block text-xs font-medium text-slate-900 dark:text-white truncate">{{ r.name }}</span>
        {% if r.shop_name %}<span class="block text-[0.7rem] text-slate-500 dark:text-slate-400 truncate">{{ r.shop_name }}</span>{% endif %}
      </span>
    </button>
    {% endfor %}
  </div>
</div>
{% else %}
<div id="booth-suggestions"></div>
{% endif %}

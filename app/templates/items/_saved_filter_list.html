{% if error %}<p class="w-full text-xs text-danger dark:text-danger-dark mb-1">{{ error }}</p>{% endif %}
{% for sf in saved_filters %}
<span class="inline-flex items-center gap-1 rounded-full bg-white/60 dark:bg-white/10 border border-white/70 dark:border-white/15 pl-1 pr-1 py-0.5 text-xs text-slate-700 dark:text-slate-200">
  <a href="/items?{{ sf.query_string }}" class="px-2 py-0.5 hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent dark:focus-visible:outline-accent-dark rounded-full">{{ sf.name }}</a>
  <button type="button"
          class="inline-flex items-center justify-center min-h-5 min-w-5 w-5 h-5 rounded-full hover:bg-black/10 dark:hover:bg-white/20 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-accent dark:focus-visible:outline-accent-dark"
          hx-delete="/fragments/saved-filters/{{ sf.id }}" hx-target="#saved-filter-list" hx-swap="innerHTML"
          hx-confirm="「{{ sf.name }}」を削除しますか？"
          aria-label="保存フィルタ「{{ sf.name }}」を削除">
    <span class="icon text-[0.8rem]" aria-hidden="true">close</span>
  </button>
</span>
{% endfor %}
